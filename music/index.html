---
layout: default
title: KH - Music
menu: music
---

<div class="posts">
    {% for post in site.posts limit: 3 %}
        <div class="post">
            <h3>{{ post.title }}</h3>
            <p>{{ post.description }}</p>
            <div class="videoWrapper">
                <iframe src="{{ post.link }}?" frameborder="0" allowfullscreen></iframe>
            </div>
        </div>
    {% endfor %}
</div>

<div class="infinite-spinner"></div>
