<!DOCTYPE html>
<html>

  {% include head.html %}

  <body>

    {% include header.html %}

    <!-- PAGE | WELCOME -->
    <div class="pages page-work" id="page-work">
        <div class="overlay"></div>
        <div class="container margin-default">
            <div class="logo">
                <div class="scrollNormal">
                    <a href="#">
                        <img src="/style/images/pages/welcome/logo_welcome.png" width="140" height="140" alt="Kevin Hou">
                    </a>
                </div>
            </div>
            <div class="row-fluid">
                <div class="span6 offset3">
                    <p style="text-align: left">{{ content | newline_to_br }}</p>
                </div>
            </div>
        </div>
    </div>
    <!-- END PAGE | Welcome -->

    <!-- PLUGINS -->
    <script src="/style/js/plugins/jquery.bxslider.min.js" type="text/javascript"></script>
    <script src="/style/js/plugins/jquery.centralized.min.js" type="text/javascript"></script>
    <script src="/style/js/plugins/jquery.fixedonlater.min.js" type="text/javascript"></script>
    <script src="/style/js/plugins/jquery.hashloader.min.js" type="text/javascript"></script>
    <script src="/style/js/plugins/jquery.mixitup.min.js" type="text/javascript"></script>
    <script src="/style/js/plugins/jquery.nav.min.js" type="text/javascript"></script>
    <script src="/style/js/plugins/jquery.parallax-1.1.3.min.js" type="text/javascript"></script>
    <script src="/style/js/plugins/jquery.responsivevideos.min.js" type="text/javascript"></script>
    <script src="/style/js/plugins/jquery.scrollTo.min.js" type="text/javascript"></script>
    <script src="/style/js/plugins/jquery.tweet.min.js" type="text/javascript"></script>
    <script src="/style/js/plugins/jquery.tweetCarousel.min.js" type="text/javascript"></script>


    <!-- INITIALIZE -->
    <script>
        $(document).ready(function() {
            $(window).height();
            var b = $(window).width(),
                a = $("#navigation").outerHeight();
            $(window).resize(function() {
                b = $(window).width();
                $(window).height()
            });
            $(".centralized").centralized({
                delay: 0,
                fadeSpeed: 0
            });
            $("#welcome-messages ul").bxSlider({
                mode: "vertical",
                auto: !0,
                minSlides: 1,
                responsive: !0,
                touchEnabled: !0,
                pager: !1,
                controls: !1,
                useCSS: !1,
                pause: 1E4
            });
        });
    </script>

    <script>
        $(function() {
            $("li#" + "{{ page.menu }}").addClass("active")
        })
    </script>


    <!-- {% include footer.html %} -->

  </body>

</html>
