                        <div class="logo">
                            <div class="scrollNormal">

                                    <img src="/images/pages/welcome/logo_welcome.png" width="140" height="140" alt="Kevin Hou">

                            </div>
                            <div class="scrollDown">
                                <a href="#">
                                    <img src="/images/pages/welcome/logo2_welcome.png" width="140" height="140" alt="Kevin Hou">
                                </a>
                            </div>
                        </div>

                        <div id="welcome-messages">
                            <h1 class="line-divider">KEVIN HOU</h1>

                                <li>

                                <li>

                                </li>
                                <li>

    <!-- PLUGINS -->
    <script src="/js/plugins/jquery.bxslider.min.js" type="text/javascript"></script>
    <script src="/js/plugins/jquery.centralized.min.js" type="text/javascript"></script>
    <script src="/js/plugins/jquery.fixedonlater.min.js" type="text/javascript"></script>
    <script src="/js/plugins/jquery.hashloader.min.js" type="text/javascript"></script>
    <script src="/js/plugins/jquery.mixitup.min.js" type="text/javascript"></script>
    <script src="/js/plugins/jquery.nav.min.js" type="text/javascript"></script>
    <script src="/js/plugins/jquery.parallax-1.1.3.min.js" type="text/javascript"></script>
    <script src="/js/plugins/jquery.responsivevideos.min.js" type="text/javascript"></script>
    <script src="/js/plugins/jquery.scrollTo.min.js" type="text/javascript"></script>
    <script src="/js/plugins/jquery.tweet.min.js" type="text/javascript"></script>
    <script src="/js/plugins/jquery.tweetCarousel.min.js" type="text/javascript"></script>


    <!-- INITIALIZE -->
    <script>
        $(document).ready(function() {
            $(window).height();
            var b = $(window).width(),
                a = $("#navigation").outerHeight();
            $(window).resize(function() {
                b = $(window).width();
                $(window).height()
            });
            $(".centralized").centralized({
                delay: 0,
                fadeSpeed: 0
            });
            $("#welcome-messages ul").bxSlider({
                mode: "vertical",
                auto: !0,
                minSlides: 1,
                responsive: !0,
                touchEnabled: !0,
                pager: !1,
                controls: !1,
                useCSS: !1,
                pause: 1E4
            });
        });
    </script>

    <script>
        $(function() {
            $("li#home").addClass("active")
        })
    </script>
